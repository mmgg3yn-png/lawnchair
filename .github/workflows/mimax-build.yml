name: Mi_Max Launcher build

on:
  workflow_dispatch:
  push:
    branches:
      - mimax/full-feature-integration
      - mimax/feature-batch-staging

permissions:
  contents: read

concurrency:
  group: mimax-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Lawnchair and required submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android build components
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-37.2" "build-tools;37.0.0"

      - name: Build Lawnchair Github debug APK
        run: ./gradlew --no-daemon --stacktrace assembleLawnWithQuickstepGithubDebug

      - name: Verify APK ABI payloads
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find . -type f -path '*/build/outputs/apk/*' -name '*.apk')
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APK produced"; exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "Inspecting $apk"
            libs="$(unzip -Z1 "$apk" | awk -F/ '$1 == "lib" && NF >= 3 { print $2 }' | sort -u | tr '\\n' ' ')"
            if [ -n "$libs" ]; then
              echo "Native ABIs: $libs"
              for abi in armeabi-v7a arm64-v8a; do
                if ! unzip -Z1 "$apk" | grep -q "^lib/$abi/"; then
                  echo "Missing $abi native payload in $apk"; exit 1
                fi
              done
            else
              echo "No packaged native libraries; APK is architecture-neutral at the native-library layer"
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi_Max-Launcher-debug
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 14
